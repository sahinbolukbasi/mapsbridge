version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3000
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  mobile:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - EXPO_DEV_SERVER_HOST=host.docker.internal
    volumes:
      - ./apps/mobile:/app
      - /app/node_modules

  database:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    volumes:
      - "./dynamodb-data:/home/dynamodblocal/data"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Mock Bedrock service for development
  bedrock-mock:
    image: node:22-alpine
    command: sh -c "echo 'Bedrock mock service running'"
    ports:
      - "3001:3001"

networks:
  default:
    driver: bridge
