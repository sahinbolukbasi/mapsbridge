name: Feature Request
description: Suggest a new feature for MapsBridge
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web Frontend
        - Mobile App
        - AI Assistant
        - API / Backend
        - Infrastructure
        - Other
    validations:
      required: true
