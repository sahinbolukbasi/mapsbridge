version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    labels:
      - dependencies
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      next:
        patterns:
          - "next"
          - "@next/*"

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    target-branch: develop
    labels:
      - dependencies
      - infrastructure

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    labels:
      - dependencies
      - ci
