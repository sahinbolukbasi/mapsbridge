name: Deploy iOS

# GÜVENLİK: Store'a submit geri alması zor bir işlemdir. Otomatik push
# tetikleyicisi KALDIRILDI — mobil release YALNIZCA elle (workflow_dispatch)
# başlatılır. Böylece bir workflow/kod değişikliği istemeden App Store/Play'e
# submit etmez (bkz. docs/DEVOPS-TODO.md #12).
on:
  workflow_dispatch:

concurrency:
  group: deploy-ios
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build & Submit iOS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check EAS token
        id: check
        run: |
          if [ -z "${{ secrets.EAS_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ EAS_TOKEN not set — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.skip == 'false'
      - uses: actions/setup-node@v7
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install EAS CLI
        if: steps.check.outputs.skip == 'false'
        run: npm install -g eas-cli

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Build iOS
        if: steps.check.outputs.skip == 'false'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit to App Store
        if: steps.check.outputs.skip == 'false'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas submit --platform ios --latest --non-interactive
