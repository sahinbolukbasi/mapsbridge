name: AI Review

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@e3ef5a70f08b73a6ca7a8dca7ce5a5e4c816e4c6 # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Collect diff
        id: diff
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- \
            '*.ts' '*.tsx' '*.tf' '*.yml' \
            ':!package-lock.json' ':!*.tsbuildinfo' \
            | head -c 30000)
          if [ -z "$DIFF" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "$DIFF" > /tmp/pr-diff.txt
            git diff --name-only origin/${{ github.base_ref }}...HEAD | head -50 > /tmp/changed-files.txt
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Review with Claude
        if: steps.diff.outputs.skip == 'false'
        run: |
          jq -n \
            --arg title "${{ github.event.pull_request.title }}" \
            --arg files "$(cat /tmp/changed-files.txt)" \
            --arg diff "$(cat /tmp/pr-diff.txt)" \
            '{
              anthropic_version: "bedrock-2023-05-31",
              max_tokens: 2048,
              messages: [{
                role: "user",
                content: ("You are a senior code reviewer for MapsBridge (TypeScript + Terraform + AWS). Review this PR concisely.\n\nPR: " + $title + "\n\nFiles:\n" + $files + "\n\nDiff:\n```\n" + $diff + "\n```\n\nProvide:\n1. **Summary** (1-2 sentences)\n2. **Issues** (bugs, security, correctness — if any)\n3. **Suggestions** (max 3)\n\nBe concise. Skip trivial changes. Markdown format.")
              }]
            }' > /tmp/payload.json

          REVIEW=""
          if aws bedrock-runtime invoke-model \
            --model-id "eu.anthropic.claude-haiku-4-5-20251001-v1:0" \
            --content-type "application/json" \
            --accept "application/json" \
            --body fileb:///tmp/payload.json \
            /tmp/response.json 2>/dev/null; then
            REVIEW=$(jq -r '.content[0].text // empty' /tmp/response.json)
          fi

          if [ -z "$REVIEW" ]; then
            echo "AI review unavailable." > /tmp/review.md
          else
            echo "$REVIEW" > /tmp/review.md
          fi

      - name: Post comment
        if: steps.diff.outputs.skip == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.md', 'utf8').trim();
            if (!review) return;
            const body = `## 🤖 AI Review\n\n${review}\n\n---\n*Claude (Bedrock) — verify before applying.*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('AI Review'));
            const opts = { owner: context.repo.owner, repo: context.repo.repo };
            if (existing) {
              await github.rest.issues.updateComment({ ...opts, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...opts, issue_number: context.issue.number, body });
            }
