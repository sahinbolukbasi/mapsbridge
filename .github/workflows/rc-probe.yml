name: RevenueCat API probe
on:
  push:
    branches: [rc-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read RevenueCat project state (GET only, no secret printed)
        env:
          RC_KEY: ${{ secrets.RC_SECRET_API_KEY }}
          RC_PROJECT: projb29ddf07
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          KEY = os.environ["RC_KEY"]; P = os.environ["RC_PROJECT"]
          BASE = "https://api.revenuecat.com"
          def get(path):
              req = urllib.request.Request(BASE + path, headers={"Authorization": "Bearer " + KEY})
              try:
                  with urllib.request.urlopen(req) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try: body = json.load(e)
                  except Exception: body = {}
                  return e.code, {k: body.get(k) for k in ("type", "code", "message")}
          def items(path):
              out = []; nxt = path
              while nxt:
                  code, d = get(nxt)
                  if code != 200: print("ERR", path, code, d); return out
                  out += d.get("items", []); nxt = d.get("next_page")
              return out
          def dump(label, obj): print(label, json.dumps(obj, ensure_ascii=False, sort_keys=True))
          def post(path, body):
              req = urllib.request.Request(BASE + path, data=json.dumps(body).encode(), method="POST",
                  headers={"Authorization": "Bearer " + KEY, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r: return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try: body = json.load(e)
                  except Exception: body = {}
                  return e.code, {k: body.get(k) for k in ("type", "code", "message")}
          # TEK SEFERLİK YAZMA: current offering'e eksik paketleri ekle (varsa atla).
          OFR = "ofrng762b1657ce"
          WANT = [("explorer_monthly", "Kaşif Aylık"), ("agency_monthly", "Tur Lideri Aylık"),
                  ("pack_30", "30 Kredi"), ("pack_100", "100 Kredi"), ("pack_300", "300 Kredi")]
          have = {k["lookup_key"] for k in items(f"/v2/projects/{P}/offerings/{OFR}/packages?limit=100")}
          for key, name in WANT:
              if key in have: print("SKIP package exists", key); continue
              code, d = post(f"/v2/projects/{P}/offerings/{OFR}/packages", {"lookup_key": key, "display_name": name})
              print("CREATE package", key, code, d.get("id") if code == 201 else d)
          for a in items(f"/v2/projects/{P}/apps"): dump("APP", a)
          for p in items(f"/v2/projects/{P}/products?limit=100&expand=items.indicative_price"): dump("PRODUCT", p)
          for w in items(f"/v2/projects/{P}/integrations/webhooks"):
              # Yetkilendirme başlığı gizli: yalnız var/yok bilgisi yazılır.
              safe = {k: v for k, v in w.items() if "auth" not in k.lower() and "secret" not in k.lower()}
              safe["has_authorization"] = any(("auth" in k.lower()) and v for k, v in w.items())
              dump("WEBHOOK", safe)
          for e in items(f"/v2/projects/{P}/entitlements?limit=100"):
              dump("ENTITLEMENT", e)
              for p in items(f"/v2/projects/{P}/entitlements/{e['id']}/products?limit=100"):
                  print("  ENT_PRODUCT", e["id"], p.get("id"), p.get("store_identifier"), p.get("app_id"))
          for o in items(f"/v2/projects/{P}/offerings?limit=100"):
              dump("OFFERING", o)
              for k in items(f"/v2/projects/{P}/offerings/{o['id']}/packages?limit=100"):
                  dump("  PACKAGE", k)
                  for p in items(f"/v2/projects/{P}/packages/{k['id']}/products?limit=100"):
                      dump("    PKG_PRODUCT", p)
          PY
