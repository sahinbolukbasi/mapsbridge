name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  NODE_VERSION: "22"

jobs:
  # ── Secret scan ──────────────────────────────────────────────────
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Lint + Format (auto-fix on develop) ─────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - name: Auto-fix formatting (on push to develop)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          npm run format
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: auto-fix formatting [skip ci]"
            git push
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # ── Merge gate: tek zorunlu kapı ─────────────────────────────────
  # Per-system workflow'lar (ci-backend/web/services/infra) path-filtreli ve
  # birbirini `needs` ile bekleyemez. Bu job PR'da HER ZAMAN koşar (path filtresiz),
  # tüm test paketlerini + typecheck'i + drift-guard'ı tek yerde zorunlu kılar.
  # Böylece "CI Results ✅" rozeti gerçekten testlerin geçtiğini garanti eder.
  merge-gate:
    name: Merge Gate (tests + typecheck + drift-guard)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - name: Typecheck (web + backend)
        run: npm run typecheck:all
      - name: Backend tests (drift-guard dahil)
        run: npm run test:backend
      - name: Web unit tests
        run: npm run test:web
      - name: Service tests
        run: npm run test:services

  # ── Summary (PR comment) ─────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [secrets, lint, merge-gate]
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Check results and comment
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'Secret Scan': '${{ needs.secrets.result }}',
              'Lint & Format': '${{ needs.lint.result }}',
              'Merge Gate (tests + typecheck + drift-guard)': '${{ needs.merge-gate.result }}',
            };
            const icon = s => s === 'success' ? '✅' : s === 'skipped' ? '⏭' : '❌';
            const rows = Object.entries(jobs)
              .map(([name, result]) => `| ${name} | ${icon(result)} ${result} |`)
              .join('\n');
            const failed = Object.values(jobs).some(r => r === 'failure');
            const body = [
              `## CI Results ${failed ? '❌' : '✅'}`,
              '',
              '| Job | Status |',
              '|-----|--------|',
              rows,
              '',
              '_Per-system checks (build, infra validate, mobile) run in their own path-filtered workflows; the Merge Gate above is the authoritative test+typecheck barrier._',
              '',
              failed
                ? '> **Action needed:** Fix the failing checks above before merging.'
                : '> Lint, secret scan, and merge gate (tests + typecheck + drift-guard) passed.',
              '',
              `_Run: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## CI Results')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
