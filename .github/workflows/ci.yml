name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: "22"

jobs:
  # ── Fast checks (no npm install needed) ─────────────────────────
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@cb7149a9b57195b609c63e8518d2c6056677d2d0 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [terraform, admin-runtime, agentcore-gateway, ai-memory]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - run: terraform init -backend=false
        continue-on-error: true
      - run: terraform validate
        continue-on-error: true

  # ── Install once, reuse across jobs ─────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            node_modules
            infra/lambda/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'infra/lambda/package-lock.json') }}

  # ── Lint + Format (fast, no build needed) ───────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            node_modules
            infra/lambda/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'infra/lambda/package-lock.json') }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # ── Tests (parallel with lint) ──────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            node_modules
            infra/lambda/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'infra/lambda/package-lock.json') }}
      - name: Web Tests
        run: npm test
      - name: Backend Tests
        run: npm run test:backend
      - name: Test Summary
        if: always()
        run: echo "✅ All test suites completed" >> $GITHUB_STEP_SUMMARY

  # ── Build (only after lint + tests pass) ────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            node_modules
            infra/lambda/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'infra/lambda/package-lock.json') }}
      - name: Build Web
        run: npm run build
        env:
          NEXT_PUBLIC_COGNITO_REGION: eu-central-1
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_AI_STREAM_URL: ${{ secrets.AI_STREAM_URL }}
          NEXT_PUBLIC_SITE_URL: https://mapsbridge.com
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_TP_MARKER: "585085"
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4
        with:
          name: web-build
          path: apps/web/out/
          retention-days: 3

  # ── Security audit (informational, never blocks) ────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [install]
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            node_modules
            infra/lambda/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'infra/lambda/package-lock.json') }}
      - run: npm audit --audit-level=high 2>&1 | tee $GITHUB_STEP_SUMMARY
