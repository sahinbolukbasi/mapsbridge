name: CI — Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/ci-web.yml"
      - "infra/admin-runtime/routes.json"
      - "infra/lambda/src/admin/permissions.ts"
  push:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "infra/admin-runtime/routes.json"
      - "infra/lambda/src/admin/permissions.ts"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - name: Run web unit tests
        run: node --test apps/web/tests/*.test.cjs

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        # Transient next/font/google (Turbopack) hatasına karşı en fazla 2 deneme.
        run: |
          npm run build || {
            echo "::warning::İlk build denemesi başarısız (muhtemelen transient font/Turbopack) — 1 kez daha deneniyor";
            sleep 5;
            npm run build;
          }
        env:
          NEXT_PUBLIC_COGNITO_REGION: eu-central-1
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_AI_STREAM_URL: ${{ secrets.AI_STREAM_URL }}
          NEXT_PUBLIC_SITE_URL: https://mapsbridge.com
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_TP_MARKER: "585085"
      - name: Build output contract tests
        env:
          REQUIRE_BUILD: "1"
        run: node --test apps/web/tests/css-layers.test.cjs apps/web/tests/route-registry.test.cjs apps/web/tests/seo-registry.test.cjs
      - uses: actions/upload-artifact@v5
        with:
          name: web-build-${{ github.sha }}
          path: apps/web/out/
          retention-days: 3
