name: Failure Notification

on:
  workflow_run:
    workflows: [CI, "Deploy Production"]
    types: [completed]

permissions:
  issues: write

jobs:
  notify-failure:
    name: Report Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `CI/CD Failure: ${run.name} on ${run.head_branch}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 5,
            });

            const existing = issues.find(i => i.title === title);
            if (existing) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `## Pipeline Failure`,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Workflow** | ${run.name} |`,
                `| **Branch** | \`${run.head_branch}\` |`,
                `| **Commit** | \`${run.head_sha.substring(0, 7)}\` |`,
                `| **Run** | [View logs](${run.html_url}) |`,
                `| **Time** | ${new Date(run.updated_at).toISOString()} |`,
                ``,
                `Please investigate and fix.`,
              ].join('\n'),
              labels: ['bug', 'ci-failure'],
            });
