name: AI Failure Analysis

on:
  workflow_run:
    workflows: [CI, "Deploy Production"]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write

jobs:
  analyze-failure:
    name: Analyze Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Collect Failure Context
        id: context
        run: |
          # Get failed job logs
          RUN_ID=${{ github.event.workflow_run.id }}
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          COMMIT="${{ github.event.workflow_run.head_sha }}"

          # Get job details
          JOBS=$(gh api repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs --jq '.jobs[] | select(.conclusion == "failure") | {name: .name, step: (.steps[] | select(.conclusion == "failure") | .name)}')

          # Get commit diff
          DIFF=$(git diff HEAD~1 HEAD -- '*.ts' '*.tsx' '*.tf' '*.yml' | head -c 10000)

          # Build context
          cat > /tmp/failure-context.json <<CTXEOF
          {
            "workflow": "$WORKFLOW_NAME",
            "branch": "$BRANCH",
            "commit": "${COMMIT:0:7}",
            "failed_jobs": $(echo "$JOBS" | jq -s '.'),
            "diff_summary": $(echo "$DIFF" | jq -Rs '.')
          }
          CTXEOF
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Analyze with Claude
        id: analysis
        run: |
          CONTEXT=$(cat /tmp/failure-context.json)

          jq -n \
            --arg ctx "$CONTEXT" \
            '{
              anthropic_version: "bedrock-2023-05-31",
              max_tokens: 1024,
              messages: [{
                role: "user",
                content: ("Analyze this CI/CD failure for MapsBridge. Provide:\n1. **Root Cause** (1-2 sentences)\n2. **Classification**: transient (retry), safe-fix (lint/format/type/snapshot), risky (logic change), or infra (needs human)\n3. **Confidence**: high/medium/low\n4. **Suggested Fix** (if safe-fix, be specific)\n\nFailure context:\n```json\n" + $ctx + "\n```\n\nBe concise. JSON output format:\n{\"root_cause\": \"...\", \"classification\": \"...\", \"confidence\": \"...\", \"suggested_fix\": \"...\", \"summary\": \"...\"}")
              }]
            }' > /tmp/analysis-payload.json

          aws bedrock-runtime invoke-model \
            --model-id "eu.anthropic.claude-haiku-4-5-20251001-v1:0" \
            --content-type "application/json" \
            --accept "application/json" \
            --body fileb:///tmp/analysis-payload.json \
            /tmp/analysis-response.json 2>&1 || true

          if [ -f /tmp/analysis-response.json ] && jq -e '.content[0].text' /tmp/analysis-response.json > /dev/null 2>&1; then
            jq -r '.content[0].text' /tmp/analysis-response.json > /tmp/analysis.txt
          else
            echo '{"root_cause": "Analysis unavailable", "classification": "infra", "confidence": "low", "suggested_fix": "Manual investigation required", "summary": "AI analysis could not be completed"}' > /tmp/analysis.txt
          fi

      - name: Create Issue with Analysis
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = fs.readFileSync('/tmp/analysis.txt', 'utf8').trim();
            const run = context.payload.workflow_run;

            let parsed;
            try {
              // Try to parse JSON from analysis (might be wrapped in markdown)
              const jsonMatch = analysis.match(/\{[\s\S]*\}/);
              parsed = jsonMatch ? JSON.parse(jsonMatch[0]) : { summary: analysis, classification: 'unknown' };
            } catch {
              parsed = { summary: analysis, classification: 'unknown', root_cause: 'See raw analysis' };
            }

            const classEmoji = {
              'transient': '🔄',
              'safe-fix': '🔧',
              'risky': '⚠️',
              'infra': '🏗️'
            };

            const emoji = classEmoji[parsed.classification] || '❓';
            const title = `${emoji} CI Failure: ${run.name} — ${parsed.root_cause?.substring(0, 60) || 'Analysis pending'}`;

            const body = [
              `## AI Failure Analysis`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Workflow** | ${run.name} |`,
              `| **Branch** | \`${run.head_branch}\` |`,
              `| **Commit** | \`${run.head_sha.substring(0, 7)}\` |`,
              `| **Classification** | ${emoji} ${parsed.classification} |`,
              `| **Confidence** | ${parsed.confidence || 'unknown'} |`,
              `| **Run** | [View logs](${run.html_url}) |`,
              ``,
              `### Root Cause`,
              parsed.root_cause || 'Unknown',
              ``,
              `### Suggested Fix`,
              parsed.suggested_fix || 'Manual investigation required',
              ``,
              `---`,
              `*Automated analysis by Claude (Bedrock) — verify before acting.*`,
            ].join('\n');

            // Check for duplicate
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 5,
            });

            const existing = issues.find(i => i.title.includes(run.name) && i.title.includes(run.head_sha.substring(0, 7)));
            if (existing) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci-failure', `class:${parsed.classification}`],
            });
