name: CI — Backend

on:
  pull_request:
    paths:
      - "infra/lambda/**"
      - "packages/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main, develop]
    paths:
      - "infra/lambda/**"
      - "packages/**"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Lambda Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - name: Run Lambda unit tests
        run: node --test infra/lambda/tests/*.test.cjs

  typecheck:
    name: TypeScript Check (Lambda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - run: npx tsc --noEmit --project infra/lambda/tsconfig.json
        continue-on-error: true
