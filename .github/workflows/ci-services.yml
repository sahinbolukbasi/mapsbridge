name: CI — Services

on:
  pull_request:
    paths:
      - "services/**"
      - "packages/**"
      - ".github/workflows/ci-services.yml"
  push:
    branches: [main, develop]
    paths:
      - "services/**"
      - "packages/**"

concurrency:
  group: ci-services-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test-ai-assistant:
    name: AI Assistant Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run AI assistant tests
        run: node --test services/ai-assistant/tests/*.test.cjs

  test-identity-billing:
    name: Identity & Billing Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run identity-billing tests
        run: node --test services/identity-billing/tests/*.test.cjs

  test-messaging:
    name: Messaging Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run messaging tests
        run: node --test services/messaging/tests/*.test.cjs

  test-place-intelligence:

    name: Place Intelligence Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run place-intelligence tests
        run: node --test services/place-intelligence/tests/*.test.cjs

  typecheck-services:
    name: TypeScript Check (Services)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-assistant, identity-billing, messaging, place-intelligence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --project services/${{ matrix.service }}/tsconfig.json
