name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - run: npm run typecheck --prefix apps/web
      - run: npm run build
      - run: npm test --prefix apps/web
        continue-on-error: true

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [terraform, admin-runtime, agentcore-gateway, ai-memory]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
        continue-on-error: true
