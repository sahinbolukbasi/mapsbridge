name: Deploy All

on:
  workflow_dispatch:
    inputs:
      components:
        description: "Deploy which components"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - web
          - api
          - ios
          - android

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    name: Trigger Deployments
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Web
        if: inputs.components == 'all' || inputs.components == 'web'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-web.yml',
              ref: 'main'
            });
            console.log('✓ Triggered Deploy Web');

      - name: Trigger API
        if: inputs.components == 'all' || inputs.components == 'api'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-api.yml',
              ref: 'main'
            });
            console.log('✓ Triggered Deploy API');

      - name: Trigger iOS
        if: inputs.components == 'all' || inputs.components == 'ios'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-ios.yml',
              ref: 'main'
            });
            console.log('✓ Triggered Deploy iOS');

      - name: Trigger Android
        if: inputs.components == 'all' || inputs.components == 'android'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-android.yml',
              ref: 'main'
            });
            console.log('✓ Triggered Deploy Android');
