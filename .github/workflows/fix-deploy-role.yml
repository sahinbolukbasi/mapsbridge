name: Fix Deploy Role Permissions

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1

jobs:
  fix:
    name: Add Terraform permissions to deploy role
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show current role identity
        run: aws sts get-caller-identity

      - name: Add terraform-ops policy to deploy role
        run: |
          ROLE_ARN=$(aws sts get-caller-identity --query Arn --output text)
          ROLE_NAME=$(echo "$ROLE_ARN" | sed 's/.*assumed-role\///' | sed 's/\/.*//')
          echo "Role name: $ROLE_NAME"

          aws iam put-role-policy \
            --role-name "$ROLE_NAME" \
            --policy-name "terraform-ops" \
            --policy-document '{
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "EC2Manage",
                  "Effect": "Allow",
                  "Action": [
                    "ec2:Describe*",
                    "ec2:CreateTags",
                    "ec2:DeleteTags"
                  ],
                  "Resource": "*"
                },
                {
                  "Sid": "TerraformStateS3",
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket",
                    "s3:GetBucketVersioning", "s3:GetEncryptionConfiguration",
                    "s3:GetBucketPolicy", "s3:GetBucketAcl", "s3:GetBucketCORS",
                    "s3:GetBucketWebsite", "s3:GetBucketTagging", "s3:PutBucketTagging",
                    "s3:GetLifecycleConfiguration", "s3:GetBucketLogging",
                    "s3:GetBucketRequestPayment", "s3:GetBucketObjectLockConfiguration",
                    "s3:GetReplicationConfiguration", "s3:GetAccelerateConfiguration",
                    "s3:GetBucketPublicAccessBlock", "s3:PutBucketPublicAccessBlock",
                    "s3:GetBucketOwnershipControls", "s3:PutBucketOwnershipControls",
                    "s3:GetIntelligentTieringConfiguration"
                  ],
                  "Resource": [
                    "arn:aws:s3:::mapsbridge-*",
                    "arn:aws:s3:::mapsbridge-*/*"
                  ]
                },
                {
                  "Sid": "FullManage",
                  "Effect": "Allow",
                  "Action": [
                    "cloudfront:*",
                    "wafv2:*",
                    "ce:*",
                    "budgets:*",
                    "elasticache:*",
                    "rds:*",
                    "kms:*",
                    "iam:*",
                    "resource-groups:*",
                    "logs:*",
                    "cognito-idp:*",
                    "dynamodb:*",
                    "firehose:*",
                    "glue:*",
                    "athena:*",
                    "sqs:*",
                    "sns:*",
                    "apigateway:*",
                    "execute-api:*",
                    "tag:*",
                    "lambda:*",
                    "ssm:*",
                    "acm:*",
                    "route53:*",
                    "cloudwatch:*",
                    "events:*",
                    "secretsmanager:*"
                  ],
                  "Resource": "*"
                }
              ]
            }'

          echo "Policy applied successfully"

      - name: Verify policies
        run: |
          ROLE_ARN=$(aws sts get-caller-identity --query Arn --output text)
          ROLE_NAME=$(echo "$ROLE_ARN" | sed 's/.*assumed-role\///' | sed 's/\/.*//')
          echo "=== Policies on $ROLE_NAME ==="
          aws iam list-role-policies --role-name "$ROLE_NAME" --query PolicyNames --output json
