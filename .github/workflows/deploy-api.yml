name: Deploy API (Lambda)

on:
  push:
    branches: [main]
    paths:
      - "infra/lambda/**"
      - "apps/web/server/**"
      - "apps/web/app/lib/ai/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  deployments: write

env:
  AWS_REGION: eu-central-1
  NODE_VERSION: "22"

jobs:
  test:
    name: Lambda Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - name: Run Lambda unit tests
        run: node --test infra/lambda/tests/*.test.cjs

  deploy:
    name: Build & Deploy Lambda
    runs-on: ubuntu-latest
    needs: [test]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Check AWS secrets
        id: check
        run: |
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ AWS_DEPLOY_ROLE_ARN not set — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.skip == 'false'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          npm ci
          npm ci --prefix infra/lambda --ignore-scripts

      - name: Build Lambda bundles with esbuild
        if: steps.check.outputs.skip == 'false'
        run: |
          LAMBDA_ROOT="infra/lambda"
          BUILD_DIR="/tmp/lambda-builds"
          mkdir -p "$BUILD_DIR"

          # Map: bundle-name → entry point (relative to repo root)
          # auth, chat, marketplace → main terraform stack (mapsbridge-prod-api-*)
          # ai, ai-stream, routes, admin, stripe, operations, background-monitor, kb-ingest, places → admin-runtime (mapsbridge-prod-*)
          # ws-onconnect, ws-onmessage, ws-ondisconnect → messaging (mapsbridge-prod-*)
          declare -A ENTRIES=(
            ["auth"]="$LAMBDA_ROOT/src/auth/index.ts"
            ["chat"]="$LAMBDA_ROOT/src/chat/index.ts"
            ["marketplace"]="$LAMBDA_ROOT/src/marketplace/index.ts"
            ["ai"]="$LAMBDA_ROOT/src/ai/index.ts"
            ["routes"]="$LAMBDA_ROOT/src/routes/index.ts"
            ["admin"]="$LAMBDA_ROOT/src/admin/index.ts"
            ["stripe"]="$LAMBDA_ROOT/src/stripe/index.ts"
            ["operations"]="$LAMBDA_ROOT/src/operations/index.ts"
            ["background-monitor"]="$LAMBDA_ROOT/src/background-monitor/index.ts"
            ["kb-ingest"]="$LAMBDA_ROOT/src/kb-ingest/index.ts"
            ["places"]="$LAMBDA_ROOT/src/places/index.ts"
            ["ws-onconnect"]="$LAMBDA_ROOT/src/ws/onconnect.ts"
            ["ws-onmessage"]="$LAMBDA_ROOT/src/ws/onmessage.ts"
            ["ws-ondisconnect"]="$LAMBDA_ROOT/src/ws/ondisconnect.ts"
            ["revenuecat"]="$LAMBDA_ROOT/src/revenuecat/index.ts"
          )

          for name in "${!ENTRIES[@]}"; do
            entry="${ENTRIES[$name]}"
            if [ ! -f "$entry" ]; then
              echo "⚠️  Entry not found, skipping: $entry"
              continue
            fi
            echo "Building: $name ← $entry"
            out="$BUILD_DIR/$name"
            mkdir -p "$out"
            infra/lambda/node_modules/.bin/esbuild "$entry" \
              --bundle \
              --platform=node \
              --target=node20 \
              --outfile="$out/index.js" \
              --minify \
              2>&1 | tail -3
            zip -jq "$BUILD_DIR/$name.zip" "$out/index.js"
            echo "  ✓ $name.zip ($(du -sh "$BUILD_DIR/$name.zip" | cut -f1))"
          done

          # ai-stream uses the same code as ai (different handler is set in Terraform)
          if [ -f "$BUILD_DIR/ai.zip" ]; then
            cp "$BUILD_DIR/ai.zip" "$BUILD_DIR/ai-stream.zip"
            echo "  ✓ ai-stream.zip (copy of ai.zip)"
          fi

      - name: Deploy to Lambda functions
        if: steps.check.outputs.skip == 'false'
        run: |
          BUILD_DIR="/tmp/lambda-builds"
          PREFIX="mapsbridge-prod"

          # Mapping: zip-name → function-name suffix (after prefix)
          # Main stack: functions are named ${PREFIX}-api-${domain}
          # Admin-runtime: functions are named ${PREFIX}-${domain}
          declare -A FUNC_MAP=(
            ["auth"]="${PREFIX}-api-auth"
            ["chat"]="${PREFIX}-api-chat"
            ["marketplace"]="${PREFIX}-api-marketplace"
            ["ai"]="${PREFIX}-ai"
            ["ai-stream"]="${PREFIX}-ai-stream"
            ["routes"]="${PREFIX}-routes"
            ["admin"]="${PREFIX}-admin"
            ["stripe"]="${PREFIX}-stripe"
            ["operations"]="${PREFIX}-operations"
            ["background-monitor"]="${PREFIX}-background-monitor"
            ["kb-ingest"]="${PREFIX}-kb-ingest"
            ["places"]="${PREFIX}-places"
            ["ws-onconnect"]="${PREFIX}-ws-onconnect"
            ["ws-onmessage"]="${PREFIX}-ws-onmessage"
            ["ws-ondisconnect"]="${PREFIX}-ws-ondisconnect"
            ["revenuecat"]="${PREFIX}-revenuecat"
          )

          FAILED=0
          SKIPPED=0
          UPDATED=0

          for name in "${!FUNC_MAP[@]}"; do
            zip_file="$BUILD_DIR/$name.zip"
            fn="${FUNC_MAP[$name]}"

            if [ ! -f "$zip_file" ]; then
              echo "⚠️  No zip for $name — skipping $fn"
              SKIPPED=$((SKIPPED+1))
              continue
            fi

            # Check if function exists before trying to update
            if ! aws lambda get-function --function-name "$fn" --query 'Configuration.FunctionName' --output text > /dev/null 2>&1; then
              echo "⚠️  Function not found (not yet deployed via Terraform): $fn"
              SKIPPED=$((SKIPPED+1))
              continue
            fi

            echo "Deploying $fn..."
            if aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://$zip_file" \
              --publish > /dev/null 2>&1; then
              echo "  ✓ $fn"
              UPDATED=$((UPDATED+1))
            else
              echo "  ✗ Failed: $fn"
              FAILED=$((FAILED+1))
            fi
          done

          echo ""
          echo "Summary: $UPDATED updated, $SKIPPED skipped (not deployed), $FAILED failed"
          [ $FAILED -gt 0 ] && echo "::error::$FAILED function(s) failed to update" && exit 1
          echo "✓ Lambda deploy complete"

      - name: Health check
        if: steps.check.outputs.skip == 'false'
        run: |
          if [ -n "${{ secrets.API_BASE_URL }}" ]; then
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.API_BASE_URL }}/health" || echo "0")
            echo "API health: $STATUS"
          fi
