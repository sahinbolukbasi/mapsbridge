  # ─── AI Training ──────────────────────────────────────────────────────────
  ai-training-plan:
    name: "Plan: ai-training"
    needs: [main-apply]
    if: |
      always() &&
      needs.main-apply.result != 'failure' &&
      (github.event.inputs.stack == 'ai-training' || github.event.inputs.stack == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_VAR_account_id: "865369794421"
      TF_VAR_prefix: mapsbridge-prod
      TF_VAR_table_name: mapsbridge-prod-data
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/ai-training
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infra/ai-training
        run: terraform plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-ai-training-${{ github.run_id }}
          path: infra/ai-training/tfplan
          retention-days: 1

  ai-training-apply:
    name: "Apply: ai-training"
    needs: [ai-training-plan]
    if: |
      (github.event.inputs.stack == 'ai-training' || github.event.inputs.stack == 'all') &&
      github.event.inputs.plan_only != 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/ai-training
        run: terraform init -input=false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-ai-training-${{ github.run_id }}
          path: infra/ai-training/

      - name: Terraform Apply
        working-directory: infra/ai-training
        run: terraform apply -auto-approve tfplan

  # ─── Travel RAG ───────────────────────────────────────────────────────────
  travel-rag-plan:
    name: "Plan: travel-rag"
