      - uses: hashicorp/setup-terraform@v3

      - name: Create Lambda zip placeholders
        run: |
          mkdir -p infra/ai-memory/.build
          echo "placeholder" | zip -q infra/ai-memory/.build/control.zip -
          echo "placeholder" | zip -q infra/ai-memory/.build/worker.zip -

      - name: Terraform Init
        working-directory: infra/ai-memory
        run: terraform init -input=false

      - name: Download plan
