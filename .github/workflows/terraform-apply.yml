name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Which stack to deploy"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - admin-runtime
          - agentcore-gateway
          - ai-memory
          - ai-finops
          - ai-training
          - travel-rag
          - all
      plan_only:
        description: "Plan only (no apply)"
        required: false
        default: false
        type: boolean
      target:
        description: "Terraform -target (e.g. module.api). Leave empty for full apply."
        required: false
        default: ""
        type: string
      refresh:
        description: "Refresh state before plan (false = faster, skip AWS reads)"
        required: false
        default: true
        type: boolean
      force_unlock:
        description: "Force-unlock state before plan (use after cancelled runs)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
# Aynı anda yalnızca bir Terraform apply — çakışan apply'ların bıraktığı stale
# state lock sorununu kökten önler.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ACCOUNT_ID: "865369794421"
  PREFIX: mapsbridge-prod
  # CI hız/otomasyon: interaktif prompt yok, gereksiz öneri çıktısı yok,
  # provider indirme paralelliği artırıldı.
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_CLI_ARGS_init: "-input=false"

jobs:
  # ─── Main Stack ──────────────────────────────────────────────────────────
  main-plan:
    name: "Plan: main"
    if: ${{ github.event.inputs.stack == 'main' || github.event.inputs.stack == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_VAR_environment: prod
      TF_VAR_frontend_domain: mapsbridge.com
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN }}
      TF_VAR_admin_domain: "admin.mapsbridge.com"
      TF_VAR_admin_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN }}
      TF_VAR_admin_allowed_cidrs: ${{ secrets.ADMIN_ALLOWED_CIDRS }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Auto-detect ACM cert
        if: env.TF_VAR_acm_certificate_arn == ''
        run: |
          CERT_ARN=""
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -n "$DIST_ID" ]; then
            CERT_ARN=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.DistributionConfig.ViewerCertificate.ACMCertificateArn' --output text 2>/dev/null || true)
          fi
          if [ -z "$CERT_ARN" ] || [ "$CERT_ARN" = "None" ] || [ "$CERT_ARN" = "null" ]; then
            CERT_ARN=$(aws acm list-certificates --region us-east-1 --query "CertificateSummaryList[?DomainName=='mapsbridge.com'].CertificateArn | [0]" --output text 2>/dev/null || true)
          fi
          if [ -n "$CERT_ARN" ] && [ "$CERT_ARN" != "None" ] && [ "$CERT_ARN" != "null" ]; then
            echo "Detected ACM cert: $CERT_ARN"
            echo "TF_VAR_acm_certificate_arn=$CERT_ARN" >> $GITHUB_ENV
            echo "TF_VAR_admin_acm_certificate_arn=$CERT_ARN" >> $GITHUB_ENV
          else
            echo "::warning::No ACM certificate found for mapsbridge.com — CloudFront will use default domain"
          fi

      - name: Create Lambda zip placeholders
        run: |
          mkdir -p infra/terraform/.build/lambdas infra/terraform/.build/layer
          printf 'exports.handler=async()=>({statusCode:200})' > /tmp/index.js
          touch -t 202001010000.00 /tmp/index.js
          for name in auth chat marketplace cognito-custom-message kb-ingest ws-onconnect ws-onmessage ws-ondisconnect; do
            zip -jqX infra/terraform/.build/lambdas/${name}.zip /tmp/index.js
          done
          zip -jqX infra/terraform/.build/layer/shared.zip /tmp/index.js

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Force-unlock state (if requested)
        if: github.event.inputs.force_unlock == 'true'
        working-directory: infra/terraform
        run: |
          LOCK_ID=$(terraform plan -lock-timeout=5s -no-color 2>&1 | grep -oP 'ID:\s+\K[a-f0-9-]+' | head -1 || true)
          if [ -n "$LOCK_ID" ]; then
            echo "Unlocking state with ID: $LOCK_ID"
            terraform force-unlock -force "$LOCK_ID"
          else
            echo "No stale lock found"
          fi

      - name: Bootstrap deploy role permissions
        working-directory: infra/terraform
        continue-on-error: true
        run: terraform apply -auto-approve -replace=aws_iam_role_policy.github_deploy -target=aws_iam_role_policy.github_deploy

      - name: Terraform Plan
        working-directory: infra/terraform
        run: |
          TARGET_ARGS=""
          if [ -n "${{ github.event.inputs.target }}" ]; then
            IFS=',' read -ra TARGETS <<< "${{ github.event.inputs.target }}"
            for t in "${TARGETS[@]}"; do
              t=$(echo "$t" | xargs)
              TARGET_ARGS="$TARGET_ARGS -target=$t"
            done
          fi
          REFRESH_ARG=""
          if [ "${{ github.event.inputs.refresh }}" = "false" ]; then
            REFRESH_ARG="-refresh=false"
          fi
          terraform plan -out=tfplan $TARGET_ARGS $REFRESH_ARG

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-main-${{ github.run_id }}
          path: infra/terraform/tfplan
          retention-days: 1

  main-apply:
    name: "Apply: main"
    needs: [main-plan]
    if: |
      (github.event.inputs.stack == 'main' || github.event.inputs.stack == 'all') &&
      github.event.inputs.plan_only != 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      TF_VAR_environment: prod
      TF_VAR_frontend_domain: mapsbridge.com
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN }}
      TF_VAR_admin_domain: "admin.mapsbridge.com"
      TF_VAR_admin_acm_certificate_arn: ${{ secrets.ACM_CERT_ARN }}
      TF_VAR_admin_allowed_cidrs: ${{ secrets.ADMIN_ALLOWED_CIDRS }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Auto-detect ACM cert
        if: env.TF_VAR_acm_certificate_arn == ''
        run: |
          CERT_ARN=""
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -n "$DIST_ID" ]; then
            CERT_ARN=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.DistributionConfig.ViewerCertificate.ACMCertificateArn' --output text 2>/dev/null || true)
          fi
          if [ -z "$CERT_ARN" ] || [ "$CERT_ARN" = "None" ] || [ "$CERT_ARN" = "null" ]; then
            CERT_ARN=$(aws acm list-certificates --region us-east-1 --query "CertificateSummaryList[?DomainName=='mapsbridge.com'].CertificateArn | [0]" --output text 2>/dev/null || true)
          fi
          if [ -n "$CERT_ARN" ] && [ "$CERT_ARN" != "None" ] && [ "$CERT_ARN" != "null" ]; then
            echo "Detected ACM cert: $CERT_ARN"
            echo "TF_VAR_acm_certificate_arn=$CERT_ARN" >> $GITHUB_ENV
            echo "TF_VAR_admin_acm_certificate_arn=$CERT_ARN" >> $GITHUB_ENV
          else
            echo "::warning::No ACM certificate found for mapsbridge.com — CloudFront will use default domain"
          fi

      - name: Create Lambda zip placeholders
        run: |
          mkdir -p infra/terraform/.build/lambdas infra/terraform/.build/layer
          printf 'exports.handler=async()=>({statusCode:200})' > /tmp/index.js
          touch -t 202001010000.00 /tmp/index.js
          for name in auth chat marketplace cognito-custom-message kb-ingest ws-onconnect ws-onmessage ws-ondisconnect; do
            zip -jqX infra/terraform/.build/lambdas/${name}.zip /tmp/index.js
          done
          zip -jqX infra/terraform/.build/layer/shared.zip /tmp/index.js

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Bootstrap deploy role permissions (apply job)
        working-directory: infra/terraform
        continue-on-error: true
        run: |
          # Deploy rolü policy'sini bu APPLY job'unda tazele; S3/Bedrock çağrıları
          # güncel izinle çalışsın (plan job'daki bootstrap tek başına propagation
          # penceresini apply'a yetiştiremiyordu → AccessDenied).
          terraform apply -auto-approve -replace=aws_iam_role_policy.github_deploy -target=aws_iam_role_policy.github_deploy
      - name: Await IAM propagation and refresh credentials
        run: |
          echo "IAM policy propagation icin 150s bekleniyor..."
          sleep 150

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-main-${{ github.run_id }}
          path: infra/terraform/

      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          # İlk deneme kaydedilmiş planı uygular. ENI detach / IAM propagation
          # kaynaklı geçici hatada güncel değişkenlerle yeniden plan+apply denenir.
          if ! terraform apply -auto-approve tfplan; then
            echo "::warning::İlk apply başarısız (ENI detach/IAM propagation olası). 60s sonra yeniden deneniyor..."
            sleep 60
            terraform apply -auto-approve
          fi

      - name: Show Outputs
        working-directory: infra/terraform
        run: terraform output -json 2>/dev/null || true

  # ─── Admin Runtime ────────────────────────────────────────────────────────
  admin-runtime-plan:
    name: "Plan: admin-runtime"
    needs: [main-apply]
    if: |
      always() &&
      needs.main-apply.result != 'failure' &&
      (github.event.inputs.stack == 'admin-runtime' || github.event.inputs.stack == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_VAR_account_id: "865369794421"
      TF_VAR_prefix: mapsbridge-prod
      TF_VAR_api_id: ${{ secrets.API_GATEWAY_ID }}
      TF_VAR_dynamodb_table: ${{ secrets.DYNAMODB_TABLE }}
      TF_VAR_cognito_user_pool_id: ${{ secrets.COGNITO_USER_POOL_ID }}
      TF_VAR_cognito_client_id: ${{ secrets.COGNITO_CLIENT_ID }}
      TF_VAR_protected_admin_sub: ${{ secrets.ADMIN_SUB }}
      TF_VAR_slack_admin_user_ids: ${{ secrets.SLACK_ADMIN_USER_IDS }}
      TF_VAR_deploy_targets: '{"routes":{"type":"lambda","name":"mapsbridge-prod-routes"},"admin":{"type":"lambda","name":"mapsbridge-prod-admin"},"ai":{"type":"lambda","name":"mapsbridge-prod-ai"}}'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Create Lambda zip placeholders
        run: |
          mkdir -p infra/admin-runtime/.build
          for name in admin routes operations ai stripe ai-stream background-monitor rag-fill; do
            echo "placeholder" | zip -q infra/admin-runtime/.build/${name}.zip -
          done

      - name: Terraform Init
        working-directory: infra/admin-runtime
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infra/admin-runtime
        run: terraform plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-admin-runtime-${{ github.run_id }}
          path: infra/admin-runtime/tfplan
          retention-days: 1

  admin-runtime-apply:
    name: "Apply: admin-runtime"
    needs: [admin-runtime-plan]
    if: |
      always() &&
      needs.admin-runtime-plan.result == 'success' &&
      github.event.inputs.plan_only != 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      TF_VAR_account_id: "865369794421"
      TF_VAR_prefix: mapsbridge-prod
      TF_VAR_api_id: ${{ secrets.API_GATEWAY_ID }}
      TF_VAR_dynamodb_table: ${{ secrets.DYNAMODB_TABLE }}
      TF_VAR_cognito_user_pool_id: ${{ secrets.COGNITO_USER_POOL_ID }}
      TF_VAR_cognito_client_id: ${{ secrets.COGNITO_CLIENT_ID }}
      TF_VAR_protected_admin_sub: ${{ secrets.ADMIN_SUB }}
      TF_VAR_slack_admin_user_ids: ${{ secrets.SLACK_ADMIN_USER_IDS }}
      TF_VAR_deploy_targets: '{"routes":{"type":"lambda","name":"mapsbridge-prod-routes"},"admin":{"type":"lambda","name":"mapsbridge-prod-admin"},"ai":{"type":"lambda","name":"mapsbridge-prod-ai"}}'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Create Lambda zip placeholders
        run: |
          mkdir -p infra/admin-runtime/.build
          for name in admin routes operations ai stripe ai-stream background-monitor rag-fill; do
            echo "placeholder" | zip -q infra/admin-runtime/.build/${name}.zip -
          done

      - name: Terraform Init
        working-directory: infra/admin-runtime
        run: terraform init -input=false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-admin-runtime-${{ github.run_id }}
          path: infra/admin-runtime/

      - name: Terraform Apply
        working-directory: infra/admin-runtime
        run: terraform apply -auto-approve tfplan

  # ─── AgentCore Gateway ────────────────────────────────────────────────────
  agentcore-gateway-plan:
    name: "Plan: agentcore-gateway"
    needs: [main-apply]
    if: |
      always() &&
      needs.main-apply.result != 'failure' &&
      (github.event.inputs.stack == 'agentcore-gateway' || github.event.inputs.stack == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_VAR_account_id: "865369794421"
      TF_VAR_prefix: mapsbridge-prod
      TF_VAR_ai_role_name: mapsbridge-prod-ai-runtime
      TF_VAR_alarm_topic_arn: ${{ secrets.ALARM_SNS_TOPIC_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Create Lambda zip placeholders
        run: |
          mkdir -p infra/agentcore-gateway/.build
          echo "placeholder" | zip -q infra/agentcore-gateway/.build/tools.zip -
          echo "placeholder" | zip -q infra/agentcore-gateway/.build/data-tools.zip -

      - name: Terraform Init
        working-directory: infra/agentcore-gateway
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infra/agentcore-gateway
        run: terraform plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-agentcore-gateway-${{ github.run_id }}
          path: infra/agentcore-gateway/tfplan
          retention-days: 1

  agentcore-gateway-apply:
    name: "Apply: agentcore-gateway"
    needs: [agentcore-gateway-plan]
    if: |
      (github.event.inputs.stack == 'agentcore-gateway' || github.event.inputs.stack == 'all') &&
      github.event.inputs.plan_only != 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      TF_VAR_account_id: "865369794421"
      TF_VAR_prefix: mapsbridge-prod
      TF_VAR_ai_role_name: mapsbridge-prod-ai-runtime
      TF_VAR_alarm_topic_arn: ${{ secrets.ALARM_SNS_TOPIC_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Create Lambda zip placeholders
        run: |
          mkdir -p infra/agentcore-gateway/.build
          echo "placeholder" | zip -q infra/agentcore-gateway/.build/tools.zip -
          echo "placeholder" | zip -q infra/agentcore-gateway/.build/data-tools.zip -

      - name: Terraform Init
        working-directory: infra/agentcore-gateway
        run: terraform init -input=false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-agentcore-gateway-${{ github.run_id }}
          path: infra/agentcore-gateway/

      - name: Terraform Apply
        working-directory: infra/agentcore-gateway
        run: terraform apply -auto-approve tfplan

  # ─── AI Memory ────────────────────────────────────────────────────────────
  ai-memory-plan:
