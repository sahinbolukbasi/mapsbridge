    env:
      TF_VAR_account_id: "865369794421"
      TF_VAR_prefix: mapsbridge-prod
      TF_VAR_ai_role_name: mapsbridge-prod-ai-runtime
      TF_VAR_source_inference_profile_arn: ${{ secrets.BEDROCK_SOURCE_INFERENCE_PROFILE_ARN }}
      TF_VAR_alarm_topic_arn: ${{ secrets.ALARM_SNS_TOPIC_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
