    if: |
      always() &&
      needs.main-apply.result != 'failure' &&
      (github.event.inputs.stack == 'travel-rag' || github.event.inputs.stack == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/travel-rag
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infra/travel-rag
        run: terraform plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-travel-rag-${{ github.run_id }}
          path: infra/travel-rag/tfplan
          retention-days: 1

  travel-rag-apply:
    name: "Apply: travel-rag"
    needs: [travel-rag-plan]
    if: |
      (github.event.inputs.stack == 'travel-rag' || github.event.inputs.stack == 'all') &&
      github.event.inputs.plan_only != 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/travel-rag
        run: terraform init -input=false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-travel-rag-${{ github.run_id }}
          path: infra/travel-rag/

      - name: Terraform Apply
        working-directory: infra/travel-rag
        run: terraform apply -auto-approve tfplan
