    if: |
      always() &&
      needs.main-apply.result != 'failure' &&
      (github.event.inputs.stack == 'ai-memory' || github.event.inputs.stack == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_VAR_account_id: "865369794421"
      TF_VAR_prefix: mapsbridge-prod
      TF_VAR_api_id: ${{ secrets.API_GATEWAY_ID }}
      TF_VAR_application_table: ${{ secrets.DYNAMODB_TABLE }}
      TF_VAR_ai_role_name: mapsbridge-prod-ai-runtime
      TF_VAR_cognito_pool_id: ${{ secrets.COGNITO_USER_POOL_ID }}
      TF_VAR_cognito_client_id: ${{ secrets.COGNITO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3

      - name: Create Lambda zip placeholders
        run: |
          mkdir -p infra/ai-memory/.build
          echo "placeholder" | zip -q infra/ai-memory/.build/control.zip -
          echo "placeholder" | zip -q infra/ai-memory/.build/worker.zip -

      - name: Terraform Init
        working-directory: infra/ai-memory
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infra/ai-memory
        run: terraform plan -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-ai-memory-${{ github.run_id }}
          path: infra/ai-memory/tfplan
          retention-days: 1

  ai-memory-apply:
    name: "Apply: ai-memory"
    needs: [ai-memory-plan]
    if: |
      (github.event.inputs.stack == 'ai-memory' || github.event.inputs.stack == 'all') &&
      github.event.inputs.plan_only != 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      TF_VAR_account_id: "865369794421"
      TF_VAR_prefix: mapsbridge-prod
      TF_VAR_api_id: ${{ secrets.API_GATEWAY_ID }}
      TF_VAR_application_table: ${{ secrets.DYNAMODB_TABLE }}
      TF_VAR_ai_role_name: mapsbridge-prod-ai-runtime
      TF_VAR_cognito_pool_id: ${{ secrets.COGNITO_USER_POOL_ID }}
