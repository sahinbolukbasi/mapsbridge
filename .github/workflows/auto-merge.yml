name: Auto Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  promote:
    name: Promote to main
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Check diff
        id: diff
        run: |
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..origin/develop)
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT

      - name: Create or reuse PR
        if: steps.diff.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --base main --head develop --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            PR=$(gh pr create \
              --base main --head develop \
              --title "release: promote develop → main" \
              --body "Automated promotion — CI passed on develop." \
              | grep -oP '\d+$')
          fi
          gh pr merge "$PR" --merge --admin
          echo "Triggering deploy..."
          gh workflow run deploy.yml --ref main
