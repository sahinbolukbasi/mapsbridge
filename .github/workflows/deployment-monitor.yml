name: Deployment Monitor

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  monitor:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Check Site Health
        id: site
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://mapsbridge.com || echo "0")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ]; then
            echo "❌ Site returned: $STATUS"
            exit 1
          fi
          echo "✓ Site healthy ($STATUS)"

      - name: Check API Health
        id: api
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "API_BASE_URL not configured — skipping"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${{ secrets.API_BASE_URL }}/health" || echo "0")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "0" ]; then
            echo "⚠️  API unhealthy: $STATUS"
            exit 1
          fi
          echo "✓ API healthy ($STATUS)"

      - name: Health Summary
        run: |
          echo "## Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Site | ${{ steps.site.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ steps.api.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
