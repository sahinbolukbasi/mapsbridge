name: CI Monitor & Auto-Fix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  analyze-failures:
    name: Analyze & Auto-Fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Run Info
        id: run
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          gh run view $RUN_ID --json conclusion,jobs --jq '.conclusion' > /tmp/conclusion.txt
          cat /tmp/conclusion.txt

      - name: Check Test Failures
        id: test-status
        run: |
          RUN_ID=${{ steps.run.outputs.run_id }}
          FAILED=$(gh run view $RUN_ID --json jobs --jq '.jobs[] | select(.conclusion=="failure") | .name' | wc -l)
          echo "failed_count=$FAILED" >> $GITHUB_OUTPUT
          if [ $FAILED -gt 0 ]; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Fix Common Issues
        if: steps.test-status.outputs.has_failures == 'true'
        run: |
          echo "🔧 Running auto-fix checks..."
          npm run format:write || true
          npm run lint:fix || true
          git add -A
          if git diff --cached --quiet; then
            echo "✓ No formatting issues"
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git commit -m "fix: auto-fix formatting and lint issues"
            git push origin HEAD:develop || echo "Push failed, may have conflicts"
          fi

      - name: Lint & Format Check
        id: format
        run: |
          npm run format:check || echo "format_failed=true" >> $GITHUB_OUTPUT
          npm run lint || echo "lint_failed=true" >> $GITHUB_OUTPUT
          npm run typecheck || echo "typecheck_failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Test Report
        id: report
        run: |
          echo "## CI Status Report" > /tmp/report.md
          echo "" >> /tmp/report.md
          echo "**Run:** ${{ github.event.workflow_run.id }}" >> /tmp/report.md
          echo "**Conclusion:** ${{ github.event.workflow_run.conclusion }}" >> /tmp/report.md
          echo "" >> /tmp/report.md
          if [ "${{ steps.format.outputs.format_failed }}" = "true" ]; then
            echo "- ❌ Formatting issues detected" >> /tmp/report.md
          fi
          if [ "${{ steps.format.outputs.lint_failed }}" = "true" ]; then
            echo "- ❌ Lint errors found" >> /tmp/report.md
          fi
          if [ "${{ steps.format.outputs.typecheck_failed }}" = "true" ]; then
            echo "- ❌ TypeScript errors found" >> /tmp/report.md
          fi
          if [ "${{ steps.test-status.outputs.has_failures }}" = "false" ]; then
            echo "- ✅ All checks passed" >> /tmp/report.md
          fi
          cat /tmp/report.md

      - name: Slack Notification - CI Status
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ github.event.workflow_run.conclusion == 'success' && '✅ CI Passed' || '❌ CI Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\ndevelop"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ github.event.workflow_run.conclusion }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Test Failures:* ${{ steps.test-status.outputs.failed_count }}\n*Auto-Fix:* ${{ steps.test-status.outputs.has_failures == 'true' && 'Applied' || 'N/A' }}"
                  }
                }
              ]
            }
        if: always()
