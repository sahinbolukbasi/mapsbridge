name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  NODE_VERSION: "22"
  TF_PARALLELISM: "20"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - run: npm run typecheck --prefix apps/web
      - run: npm test --prefix apps/web
      - run: node --test infra/lambda/tests/*.test.cjs

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [terraform, admin-runtime, agentcore-gateway, ai-memory]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate

  build:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - run: npm run build --prefix apps/web
        env:
          NEXT_PUBLIC_COGNITO_REGION: eu-central-1
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_AI_STREAM_URL: ${{ secrets.AI_STREAM_URL }}
          NEXT_PUBLIC_SITE_URL: https://mapsbridge.com
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_TP_MARKER: "585085"
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/out/
          retention-days: 1

  build-lambdas:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/lambda/package-lock.json
      - run: npm ci --prefix infra/lambda --ignore-scripts
      - run: npm ci --prefix apps/web
      - run: node infra/lambda/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-builds
          path: |
            infra/terraform/.build/
            infra/admin-runtime/.build/
          retention-days: 1

  deploy-frontend:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, terraform-validate]
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: out/
      - name: Deploy to S3
        run: |
          aws s3 sync out/ s3://${{ secrets.WEB_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp s3://${{ secrets.WEB_BUCKET }}/ s3://${{ secrets.WEB_BUCKET }}/ \
            --recursive --exclude "*" --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --metadata-directive REPLACE --content-type "text/html"
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  deploy-infra:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-lambdas, terraform-validate]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-builds
          path: infra/
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Deploy admin-runtime
        working-directory: infra/admin-runtime
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_prefix: mapsbridge-prod
          TF_VAR_region: eu-central-1
          TF_VAR_api_id: ${{ secrets.API_GATEWAY_ID }}
          TF_VAR_dynamodb_table: mapsbridge-prod-data
          TF_VAR_cognito_user_pool_id: ${{ secrets.COGNITO_USER_POOL_ID }}
          TF_VAR_cognito_client_id: ${{ secrets.COGNITO_CLIENT_ID }}
          TF_VAR_frontend_origin: https://mapsbridge.com
          TF_VAR_protected_admin_sub: ${{ secrets.ADMIN_SUB }}
        run: |
          terraform init
          terraform apply -auto-approve -refresh=false -parallelism=${{ env.TF_PARALLELISM }}
