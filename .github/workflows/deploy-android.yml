name: Deploy Android

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/deploy-android.yml"
  workflow_dispatch:

concurrency:
  group: deploy-android
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build & Submit Android
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check EAS token
        id: check
        run: |
          if [ -z "${{ secrets.EAS_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️ EAS_TOKEN not set — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install EAS CLI
        if: steps.check.outputs.skip == 'false'
        run: npm install -g eas-cli

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        working-directory: apps/mobile
        run: npm install

      - name: Build Android
        if: steps.check.outputs.skip == 'false'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas build --platform android --profile production --non-interactive

      - name: Submit to Google Play
        if: steps.check.outputs.skip == 'false' && secrets.GOOGLE_SERVICE_ACCOUNT_KEY != ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: eas submit --platform android --latest --non-interactive
        continue-on-error: true
